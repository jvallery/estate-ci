name: estate-ci sidecar-run
description: >-
  Run a shell script inside a sidecar container of the current ARC runner Pod
  (the `job` image sidecar or the `kaniko` builder) through the Pod-local
  exchange directory. Output streams into the step log; the step fails with the
  script's exit status. No Docker daemon, socket or Kubernetes API is used.
inputs:
  sidecar:
    description: Sidecar name (job | kaniko)
    required: true
  run:
    description: POSIX shell script to run in the sidecar
    required: true
  env-names:
    description: Space-separated names of runner environment variables to pass through
    required: false
    default: ""
  working-directory:
    description: Working directory (must be under the runner workspace, which the sidecar shares)
    required: false
    default: ""
  timeout-seconds:
    description: Maximum run time
    required: false
    default: "3600"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SIDECAR: ${{ inputs.sidecar }}
        SCRIPT: ${{ inputs.run }}
        ENV_NAMES: ${{ inputs.env-names }}
        WORKDIR: ${{ inputs.working-directory }}
        TIMEOUT: ${{ inputs.timeout-seconds }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
