name: estate-ci setup-crane
description: Install the pinned, checksum-verified crane binary (go-containerregistry) into the tool path.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CRANE_VERSION: v0.22.1
        CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
      run: |
        set -euo pipefail
        dest="${RUNNER_TEMP}/estate-ci-bin"
        mkdir -p "$dest"
        if [[ ! -x "$dest/crane" ]]; then
          tgz="${RUNNER_TEMP}/crane.tgz"
          curl -fsSL --retry 3 -o "$tgz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  ${tgz}" | sha256sum -c -
          tar -xzf "$tgz" -C "$dest" crane
          rm -f "$tgz"
        fi
        echo "$dest" >> "$GITHUB_PATH"
