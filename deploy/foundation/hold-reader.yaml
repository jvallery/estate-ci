# D-67: the slot advertisers read ConfigMap ci-runner-slot-hold (written by the
# ci-runner-hot-guard CronJob) and advertise 0 (or the "cap=N" value)
# agentfleet.vallery.net/ci-runner-slot on a held node. They may get only that
# ConfigMap. A 404 (no hold yet) is "no holds"; a 403 would freeze ci-runner-slot.
# Subject: estate-ci's CronJob ci-runner-slots (runner-slots.yaml, estate-ci#76). The
# jvallery/agents arc-validation-pool reconciler lost its ci-runner-slot path in the
# #76 cutover (agents#6405, 2026-11-10), so it is no longer a subject (estate-ci#119).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-runner-slot-hold-reader
  labels: {app.kubernetes.io/name: ci-runner-hot-guard, app.kubernetes.io/part-of: estate-ci}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [ci-runner-slot-hold]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-runner-slot-hold-reader
  labels: {app.kubernetes.io/name: ci-runner-hot-guard, app.kubernetes.io/part-of: estate-ci}
subjects:
  - kind: ServiceAccount
    name: ci-runner-slots
    namespace: ci-runners
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-runner-slot-hold-reader}
