# node8 hot guard (D-67, Jason first-hand 2026-11-07): estate-ci runners may use
# vm-k3s-node8 (Frigate's node) as overflow, and always lose to Frigate.
#
# Every estate-ci runner Pod requests one agentfleet.vallery.net/ci-runner-slot
# (advertised per node by CronJob ci-runner-slots from ConfigMap
# ci-runners/ci-runner-slots, runner-slots.yaml; STD-CI-10: node4-7 20 (D-141),
# node8 4 (D-168); ADR-0010 item 5 holds the current values). Every
# minute this CronJob reads node8 and Frigate signals from Prometheus
# (bin/hot-guard.py, thresholds in hot-guard-config.json). Two tiers (COORD
# 2026-11-07T03:49Z, after a CPU-only trip killed in-flight jobs):
#   HARD (Frigate skipped/decode deficit, a frigate restart, node memory): write a
#     reason under node8 in ConfigMap ci-runner-slot-hold (the advertiser sets
#     0 slots within about a minute) and evict node8 runner Pods newest-first
#     (evict_per_run per run). The hold drops after 15 clean minutes.
#   SOFT (node8 CPU min over 4 min > 0.85, Frigate clean): write "cap=4 ..." (the
#     advertiser sets min(desired, 4)); nothing is evicted. The cap drops once
#     node8 CPU max over 10 min is below 0.75.
# A missing signal or an unreachable Prometheus holds node8 at 0 (fail closed)
# without evicting, and the run exits 1.
#
# Per-node reserve (estate-ci#69, D-486): for each of node4-7, when CPU busy /
# allocatable stays above 0.85 for 2 min, the guard writes "cap=10 ... reserve:..."
# under that node (the advertiser offers min(desired, 10)), so no new runner lands
# there; nothing is evicted. The cap drops once the max over 10 min is below 0.75.
# A reserve query that fails or is empty writes nothing (no fail-closed on node4-7),
# and the guard never changes a hold value it did not write as a reserve cap.
#
# Least privilege: no node or cluster-scoped permission. The guard may create
# ConfigMaps and get/patch only ci-runner-slot-hold, list Pods, and evict Pods in
# ci-runners. The advertisers' read access to ci-runner-slot-hold is in hold-reader.yaml.
#
# Operate:
#   log:           kubectl -n ci-runners logs job/<latest ci-runner-hot-guard job>
#   state:         kubectl -n ci-runners get cm ci-runner-slot-hold -o yaml
#   pause guard:   set "mode": "dry-run" in hot-guard-config.json (PR); every write becomes dryRun=All
#   forced trip:   docs/adr/0002-runner-topology-and-capacity.md "node8 overflow (D-67)"
# Alerts (jvallery/monitoring-stack): EstateCINode8GuardTripped, EstateCINode8GuardFailing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner-hot-guard
  labels: {app.kubernetes.io/name: ci-runner-hot-guard, app.kubernetes.io/part-of: estate-ci}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-runner-hot-guard
  labels: {app.kubernetes.io/name: ci-runner-hot-guard, app.kubernetes.io/part-of: estate-ci}
rules:
  # create cannot be restricted by name; the guard only ever creates ci-runner-slot-hold.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [ci-runner-slot-hold]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-runner-hot-guard
  labels: {app.kubernetes.io/name: ci-runner-hot-guard, app.kubernetes.io/part-of: estate-ci}
subjects:
  - kind: ServiceAccount
    name: ci-runner-hot-guard
    namespace: ci-runners
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-runner-hot-guard}
---
# ci-runners is default-deny. The guard reaches only DNS, the Kubernetes API and
# the Prometheus HA query endpoint (observability admits it in monitoring-stack).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hot-guard-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ci-runner-hot-guard}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # kube-router may enforce before or after Service DNAT: the API Service and
    # the three control-plane endpoints.
    - to:
        - ipBlock: {cidr: 10.43.0.1/32}
        - ipBlock: {cidr: 192.168.30.31/32}
        - ipBlock: {cidr: 192.168.30.32/32}
        - ipBlock: {cidr: 192.168.30.33/32}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus-ha-query}
      ports:
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 10902}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-runner-hot-guard
  labels: {app.kubernetes.io/name: ci-runner-hot-guard, app.kubernetes.io/part-of: estate-ci}
spec:
  schedule: "* * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels: {app.kubernetes.io/name: ci-runner-hot-guard, app.kubernetes.io/part-of: estate-ci}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 55
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          # Deliberately NO estate-ci.vallery.net/profile label: the guard is not
          # a runner (no runner NetworkPolicy, never evicted by itself).
          labels: {app.kubernetes.io/name: ci-runner-hot-guard, app.kubernetes.io/part-of: estate-ci}
        spec:
          serviceAccountName: ci-runner-hot-guard
          automountServiceAccountToken: true
          enableServiceLinks: false
          restartPolicy: Never
          priorityClassName: estate-default
          imagePullSecrets: [{name: zot-pull}]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile: {type: RuntimeDefault}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - {key: kubernetes.io/hostname, operator: NotIn, values: [vm-k3s-node8]}
          containers:
            - name: guard
              # Small stdlib python (same digest as the agents arc-validation-pool reconciler,
              # cached on the workers). The multi-GB toolbox missed the 55 s deadline on a
              # freshly rebuilt node (2026-11-07).
              image: python:3.13.5-alpine3.22@sha256:37b14db89f587f9eaa890e4a442a3fe55db452b69cca1403cc730bd0fbdc8aaf
              imagePullPolicy: IfNotPresent
              command: [python3, /opt/hot-guard/hot-guard.py]
              env:
                - {name: GUARD_CONFIG, value: /etc/hot-guard/config.json}
              resources:
                requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 16Mi}
                limits: {cpu: 500m, memory: 128Mi, ephemeral-storage: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: source, mountPath: /opt/hot-guard, readOnly: true}
                - {name: config, mountPath: /etc/hot-guard, readOnly: true}
          volumes:
            - name: source
              configMap: {name: ci-runner-hot-guard, defaultMode: 0555}
            - name: config
              configMap:
                name: ci-runner-hot-guard-config
                items: [{key: hot-guard-config.json, path: config.json}]
