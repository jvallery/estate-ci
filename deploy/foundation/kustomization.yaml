apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ci-runners
resources:
  - namespace.yaml
  - quota.yaml
  - networkpolicies.yaml
generatorOptions:
  # Runner Pod templates reference this name; keep it stable.
  disableNameSuffixHash: true
configMapGenerator:
  - name: estate-ci-scripts
    # Mounted at /opt/estate-ci in every runner Pod ($ESTATE_CI). All CI logic
    # lives here and in each repo's own scripts; workflow YAML only calls them.
    files:
      - bin/sidecar-agent.sh
      - bin/sidecar-run.sh
      - bin/job-started-guard.sh
      - bin/image-build.sh
      - bin/pin-bump.sh
      - bin/pin-rewrite.py
      - bin/forge-api.sh
      - bin/wait-postgres.sh
      - bin/check-runner-labels.sh
      - bin/lint-workflows.py
