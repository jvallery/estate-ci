apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ci-runners
resources:
  - namespace.yaml
  - quota.yaml
  - networkpolicies.yaml
generatorOptions:
  # Runner Pod templates reference this name; keep it stable.
  disableNameSuffixHash: true
configMapGenerator:
  - name: estate-ci-scripts
    files:
      - files/sidecar-agent.sh
      - files/job-started-guard.sh
