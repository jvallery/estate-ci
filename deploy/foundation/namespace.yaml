apiVersion: v1
kind: Namespace
metadata:
  name: ci-runners
  labels:
    app.kubernetes.io/part-of: estate-ci
    # Runner Pods are admitted at "baseline": no privileged containers, host
    # namespaces, hostPath or added capabilities. Only the Kaniko sidecar runs as
    # root (default capabilities, RuntimeDefault seccomp). Every other container
    # also meets "restricted"; warn/audit report the gap.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
