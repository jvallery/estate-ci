# Runner Pods: no ingress at all. Egress only to DNS, the public internet
# (80/443, RFC1918 and other special ranges excluded), the split-horizon apps
# ingress (registry.vallery.net and other public names resolve to 192.168.7.10
# in-cluster) and the zot origin Service for pushes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-egress
spec:
  podSelector:
    matchExpressions:
      - key: estate-ci.vallery.net/profile
        operator: Exists
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock:
            cidr: 192.168.7.10/32
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-apps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {protocol: TCP, port: 8443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: registry-origin
          podSelector:
            matchLabels:
              app.kubernetes.io/name: zot
      ports:
        - {protocol: TCP, port: 5000}
---
# estate-ci#127: the image-build CVE gate (deploy/foundation/bin/image-build.sh) reads the
# R26 findings exceptions anonymously from the in-cluster git mirror. The mirror serves the
# private history of every mirrored repo without auth, so only the build sets of owner-only
# jvallery repos are listed (a new set is excluded until added here and in the matching
# ingress in jvallery/agents platform/kubernetes/git-mirror/networkpolicy.yaml). Excluded:
# options-tracker-build, verdify-platform-build, verdify-www-build (non-owner writers).
# Only the git-mirror Pods, only 8080 (Service git-mirror:80 -> http).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: build-runner-git-mirror-egress
spec:
  podSelector:
    matchExpressions:
      - key: estate-ci.vallery.net/profile
        operator: In
        values: [build]
      - key: actions.github.com/scale-set-name # set by the ARC controller on every runner Pod
        operator: In
        values: [agents-build, cortex-ai-compute-build, docs-build, estate-ci-build,
                 estate-platform-build, homeassistant-build, kepler-build, monitoring-stack-build,
                 network-infra-build, research-vault-build, storage-infra-build, weather-build]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: git-mirror
          podSelector:
            matchLabels:
              app.kubernetes.io/name: git-mirror
      ports:
        - {protocol: TCP, port: 8080}
