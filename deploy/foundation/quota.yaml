# Hard envelope for every estate-ci runner Pod. Workers are memory-tight
# (node4/5/7 at 92-95% of allocatable memory requested on 2026-11-06), so this
# starts small for the pilot. Each repo cutover raises it by exactly what that
# repo's native-ci budget (agent-fleet-ci-*) gives up: capacity moves, it is
# never added. Target envelope after all cutovers: ~40 CPU / 64Gi requests.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: estate-ci-runners
#
# Moves in (one block per cutover; the agents PR lowering the native side is
# named in each block):
# - jvallery/research-vault (research-vault#200): +4 pods, +4 CPU / +7424Mi
#   requests, +17 CPU / +34Gi limits, +45Gi / +154Gi ephemeral storage. That is
#   the sum of its sets at maxRunners: research-vault-ci 2 x (750m / 1280Mi req,
#   4 CPU / 6Gi lim), research-vault-pg 1 x (1250m / 2304Mi, 5 CPU / 8Gi),
#   research-vault-build 1 x (1250m / 2560Mi, 4 CPU / 14Gi). Taken from
#   agent-fleet-ci/agent-fleet-ci-foreign-budget, which charges research-vault's
#   native checks (600m / 1152Mi req, 2.5 CPU / 4.5Gi lim per repo-validate
#   slot, measured 2026-11-06): requests.cpu 20 -> 16, requests.memory 28Gi ->
#   21248Mi, limits.cpu 74 -> 57, limits.memory 116Gi -> 82Gi, pods 56 -> 52.
#   Ephemeral storage is not a native quota dimension; the native check pods'
#   emptyDirs (4Gi / 12Gi each) go away with them.
# - jvallery/kepler (kepler#34): +3 pods, +2250m CPU / +4608Mi requests, +12 CPU
#   / +16Gi limits, +36Gi / +120Gi ephemeral storage. That is the sum of its sets
#   at maxRunners: kepler-ci 2 x (750m / 1536Mi req, 4 CPU / 5Gi lim),
#   kepler-buildcheck 1 x (750m / 1536Mi, 4 CPU / 6Gi). The native side (kepler's
#   repo-validate and repo-build charges in agent-fleet-ci) is lowered by the same
#   amount in the agents PR that disables kepler's catalog row (runbook step 6).
# - MIGRATE-INFRA repos (jvallery/agents#6092: monitoring-stack, network-infra,
#   storage-infra, cortex-ai-compute, proxmox-infrastructure, home-dotfiles,
#   AI_presentation, backups, immich-config, orbit, paige-companion, wordpress):
#   +20 pods, +16750m CPU / +35328Mi requests, +90 CPU / +145Gi limits,
#   +208Gi / +736Gi ephemeral storage = the sum of their sets at maxRunners
#   (12 ci sets, 16 pods; 4 build sets). Their checks run today on the
#   github-runners validation-standard sets (8 per repo, 1 CPU / 1Gi request each,
#   arc-runner-budget/arc-standard-runner-budget) and their 19 image builds in
#   agent-fleet-ci repo-build; those budgets drop by the same amount in the agents
#   delete-set PR that removes each repo's legacy set and catalog row (runbook
#   steps 6-7). The four repos that ran on GitHub-hosted runners add no native
#   capacity to give back.
# - MIGRATE-INFRA 2026-11-06 (estate-ci#26): jvallery/backups archived, its
#   backups-ci set removed: -1 pod, -500m CPU / -1Gi requests, -4 CPU / -5Gi
#   limits, -8Gi / -32Gi ephemeral. proxmox-infrastructure, home-dotfiles and
#   AI_presentation ci sets drop their job sidecar (runner image = toolbox, same
#   CPU/memory): -12Gi / -48Gi ephemeral.
# - jvallery/kepler build (kepler#34 step 6): +1 pod, +750m CPU / +1536Mi
#   requests, +4 CPU / +6Gi limits, +20Gi / +56Gi ephemeral (kepler-build 1 x
#   runner + Kaniko, same sizes as kepler-buildcheck). Native side: kepler's
#   repo-build charge in agent-fleet-ci, lowered with its catalog row (step 6).
spec:
  hard:
    pods: "39"
    requests.cpu: "31250m"
    requests.memory: 64256Mi
    limits.cpu: "151"
    limits.memory: 260Gi
    requests.ephemeral-storage: 449Gi
    limits.ephemeral-storage: 1386Gi
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: estate-ci-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 256Mi
      default:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 1Gi
