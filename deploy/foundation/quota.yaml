# Quotas for namespace ci-runners. Current state (2026-11-09, estate-ci#105):
# native CI is retired (jvallery/agents#6254, D-141), so there is no native
# budget to move capacity from. D-34/D-39 sized these quotas to every set at
# maxRunners (sum + ~10%), and the COORD P0 of 2026-11-07 set the compute
# envelope estate-ci-runner-pods to requests.cpu 215 (node4-8 allocatable
# 5 x 43; node4-8 read 5 x 47 = 235 on 2026-11-09). Since estate-ci#69
# (2026-11-09, D-486, D-488) its requests.cpu (98, then 82 since D-575 (c),
# estate-ci#193) is the per-worker CPU budget again (ADR-0010 point 7; the
# dated blocks below); this object keeps the object
# and ephemeral caps; estate-ci-ops budgets the hot guard.
# Raise a value only with live headroom on the runner workers, and add a dated
# block below. The blocks below are the history, oldest first; their
# "native side" lines and the original pilot target (~40 CPU / 64Gi) are
# superseded.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: estate-ci-runners
#
# Moves in (one block per cutover; the agents PR lowering the native side is
# named in each block):
# - jvallery/research-vault (research-vault#200): +4 pods, +4 CPU / +7424Mi
#   requests, +17 CPU / +34Gi limits, +45Gi / +154Gi ephemeral storage. That is
#   the sum of its sets at maxRunners: research-vault-ci 2 x (750m / 1280Mi req,
#   4 CPU / 6Gi lim), research-vault-pg 1 x (1250m / 2304Mi, 5 CPU / 8Gi),
#   research-vault-build 1 x (1250m / 2560Mi, 4 CPU / 14Gi). Taken from
#   agent-fleet-ci/agent-fleet-ci-foreign-budget, which charges research-vault's
#   native checks (600m / 1152Mi req, 2.5 CPU / 4.5Gi lim per repo-validate
#   slot, measured 2026-11-06): requests.cpu 20 -> 16, requests.memory 28Gi ->
#   21248Mi, limits.cpu 74 -> 57, limits.memory 116Gi -> 82Gi, pods 56 -> 52.
#   Ephemeral storage is not a native quota dimension; the native check pods'
#   emptyDirs (4Gi / 12Gi each) go away with them.
# - jvallery/kepler (kepler#34): +3 pods, +2250m CPU / +4608Mi requests, +12 CPU
#   / +16Gi limits, +36Gi / +120Gi ephemeral storage. That is the sum of its sets
#   at maxRunners: kepler-ci 2 x (750m / 1536Mi req, 4 CPU / 5Gi lim),
#   kepler-buildcheck 1 x (750m / 1536Mi, 4 CPU / 6Gi). The native side (kepler's
#   repo-validate and repo-build charges in agent-fleet-ci) is lowered by the same
#   amount in the agents PR that disables kepler's catalog row (runbook step 6).
# - MIGRATE-INFRA repos (jvallery/agents#6092: monitoring-stack, network-infra,
#   storage-infra, cortex-ai-compute, proxmox-infrastructure, home-dotfiles,
#   AI_presentation, backups, immich-config, orbit, paige-companion, wordpress):
#   +20 pods, +16750m CPU / +35328Mi requests, +90 CPU / +145Gi limits,
#   +208Gi / +736Gi ephemeral storage = the sum of their sets at maxRunners
#   (12 ci sets, 16 pods; 4 build sets). Their checks run today on the
#   github-runners validation-standard sets (8 per repo, 1 CPU / 1Gi request each,
#   arc-runner-budget/arc-standard-runner-budget) and their 19 image builds in
#   agent-fleet-ci repo-build; those budgets drop by the same amount in the agents
#   delete-set PR that removes each repo's legacy set and catalog row (runbook
#   steps 6-7). The four repos that ran on GitHub-hosted runners add no native
#   capacity to give back.
# - MIGRATE-INFRA 2026-11-06 (estate-ci#26): jvallery/backups archived, its
#   backups-ci set removed: -1 pod, -500m CPU / -1Gi requests, -4 CPU / -5Gi
#   limits, -8Gi / -32Gi ephemeral. proxmox-infrastructure, home-dotfiles and
#   AI_presentation ci sets drop their job sidecar (runner image = toolbox, same
#   CPU/memory): -12Gi / -48Gi ephemeral.
# - jvallery/kepler build (kepler#34 step 6): +1 pod, +750m CPU / +1536Mi
#   requests, +4 CPU / +6Gi limits, +20Gi / +56Gi ephemeral (kepler-build 1 x
#   runner + Kaniko, same sizes as kepler-buildcheck). Native side: kepler's
#   repo-build charge in agent-fleet-ci, lowered with its catalog row (step 6).
# - MIGRATE-APPS checks (docs#22, options-tracker#167, sentinel#612,
#   homeassistant#1114): +8 pods, +7 CPU / +15360Mi requests, +36 CPU / +48Gi
#   limits, +64Gi / +256Gi ephemeral. Sets at maxRunners: docs-ci 1,
#   options-tracker-ci 1 (750m / 2Gi req, 5 CPU / 6Gi lim each), sentinel-ci 2,
#   homeassistant-ci 2 (750m / 1536Mi, 4 CPU / 5Gi), homeassistant-ci-ha 1,
#   homeassistant-ci-esphome 1 (1250m / 2560Mi, 5 CPU / 8Gi). Native side: these
#   repos' repo-validate charges in agent-fleet-ci, lowered with each catalog row.
# - COORD 2026-11-06 ~17:42Z (NATIVE-EXIT, agents#6164): docs-ci max 1 -> 3 and
#   research-vault-ci max 2 -> 3: +3 pods, +2250m CPU / +5376Mi requests, +14 CPU
#   / +18Gi limits, +24Gi / +96Gi ephemeral (docs-ci 2 x 750m / 2Gi req, 5 CPU /
#   6Gi lim; research-vault-ci 1 x 750m / 1280Mi, 4 CPU / 6Gi; 8Gi / 32Gi
#   ephemeral each). Native side, read live at 17:4xZ: agents#6164 scales
#   native-ci-controller to 0 (250m / 2304Mi req, 2 CPU / 6Gi lim) and the
#   native-candidate-validation egress proxy 2 -> 0 (2 x 100m / 128Mi, 500m /
#   512Mi), which also ends native candidate pods (5 live: 3 small 1100m / 640Mi,
#   2 large 3100m / 2688Mi): 9950m / 9856Mi requests given up >= the 2250m /
#   5376Mi taken here.
# - COORD GO-FAST 2026-11-06 ~18:1xZ (Jason first-hand: "Drive FAST"): sized
#   from live load, not per-set arithmetic. research-vault-ci max 3 -> 4,
#   agents-build 2 -> 4, verdify-platform-ci 2 -> 3, verdify-platform-ci-pg
#   1 -> 3 (verdify#1402 waiting on capacity). agents-ci stays 12: worker
#   memory requests were 75-91% of allocatable on node4-7 at 18:0xZ, so 16
#   waits for the native drain. Native agent-fleet-ci held ~22.4 CPU /
#   28.6GiB requests across 48 pods (COORD read) and goes to 0 as agents#6164
#   and the build moves land (35 pods / 5.4 CPU / 14.4GiB at 18:0xZ).
#   limits.cpu was the binding dimension (199/201). pods 50 -> 70,
#   requests.cpu 40.5 -> 60, requests.memory 83Gi -> 106Gi, limits.cpu 201 ->
#   260, limits.memory 326Gi -> 400Gi, ephemeral 537Gi / 1738Gi -> 600Gi /
#   2000Gi (node4-7 ephemeral allocatable ~1.1TiB).
# - D-29 (Jason, 2026-11-06 ~19:0xZ): agents-ci max 16 -> 24 (+8 runners =
#   +10 CPU / +16Gi requests, +64 CPU / +80Gi limits); limits.cpu 260 -> 320.
#   Requests and limits.memory unchanged (COORD).
# - D-34 (Jason first-hand, 2026-11-06 ~19:4xZ): "allow CI to run if the memory
#   is currently free since these are ephemeral pods, and then queue CI if the
#   memory isn't free." The quota counts declared requests/limits, not use, so
#   it no longer gates CI: it is sized to every set at maxRunners (50 sets, 101
#   pods: 104.5 CPU / 209.75Gi requests, 547 CPU / 857Gi limits, 1070Gi /
#   3716Gi ephemeral; computed from deploy/runners/apps at this commit, pod
#   effective = max(sum containers, max init)). The scheduler is the gate: a
#   runner pod that does not fit stays Pending and ARC 0.14.2 leaves the job
#   queued in GitHub (no failure path for Pending). Runner pods use
#   PriorityClass ci-runner (value 0, preemptionPolicy Never), so CI never
#   preempts anything. A maxRunners raise must still raise this envelope.
# - COORD 2026-11-06 ~20:0xZ (Jason: accelerate RV2 CI): research-vault-ci job
#   container 500m / 768Mi req, 2 / 4Gi lim -> 2 / 2Gi req, 8 / 8Gi lim, max 4:
#   +6 CPU / +5Gi requests, +24 CPU / +16Gi limits. Sum at max is now 110.5 CPU
#   / 214.75Gi requests, 571 CPU / 873Gi limits.
# - COORD/DASH 2026-11-06 ~20:2xZ (verdify release-4 critical path):
#   verdify-platform-ci-tools max 2 -> 6, verdify-platform-ci-esphome 1 -> 2.
#   Sum at max is now 106 pods, 114.75 CPU / 223.25Gi requests, 593 CPU /
#   907Gi limits, 1110Gi / 3876Gi ephemeral.
# - D-39 (Jason first-hand 2026-11-06 ~21:15Z, estate-ci#55): burstable runners.
#   Job/kaniko/runner-as-job containers request measured use (72h per-pool p95
#   working set, floor 250m / 512Mi) with limits.cpu 16 so a job can use idle
#   cores; memory limits max(current, 1.5x observed max) within 8-16Gi.
#   Ephemeral requests runner 4 -> 1Gi, job 4 -> 2Gi, kaniko 16 -> 8Gi (live
#   mean 1.6Gi per CI pod; limits and emptyDir sizeLimits unchanged). Hot pools
#   x3 maxRunners, all others >= 2. Sum at max: 214 pods, 132.5 CPU / 331.5Gi
#   requests, 3907 CPU / 2254Gi limits, 910Gi / 7804Gi ephemeral; hard = sum
#   + ~10%. The scheduler (node free requests) is the gate, not this quota.
# - D-55 (Jason first-hand 2026-11-06 ~22:43Z, ARC-RAISE): hot pools about
#   +30% maxRunners, delivered after node4/node5 return (pi#481), on top of
#   the zero-sum rebalances estate-ci#63 (agents-ci 24 -> 30) and #64
#   (monitoring-stack-ci 6 -> 9): agents-ci 30 -> 37, research-vault-ci
#   12 -> 16, research-vault-pg 9 -> 12, monitoring-stack-ci 9 -> 11,
#   storage-infra-ci and network-infra-ci 6 -> 8,
#   cortex-ai-compute-ci, homeassistant-ci-ha and verdify-platform-ci-esphome
#   2 -> 3, research-vault-build 2 -> 3 (+24 runners). Requests unchanged (#59 p50
#   sizing). Sum at max, pod effective = max(sum containers, max init), from
#   deploy/runners/apps: 214 -> 238 pods, 95.6 -> 108.8 CPU / 171.8 ->
#   191.5Gi requests, 3913 -> 4362 CPU / 2234 -> 2484Gi limits, 895 -> 976Gi
#   / 7750 -> 8548Gi ephemeral. Raised to sum + ~10% where the sum crossed
#   hard: pods 236 -> 262, limits.cpu 4300 -> 4780, limits.memory 2480 ->
#   2740Gi, ephemeral 1000 -> 1080Gi / 8600 -> 9400Gi. Requests hard
#   unchanged (above sum + 10%).
#
# D-87 (2026-11-07): the compute envelope above moved to estate-ci-runner-pods,
# scoped to runner Pods (PriorityClass ci-preemptible), because pending runners
# filled the shared quota and the node8 hot guard CronJob (estate-default) was
# refused at admission ("exceeded quota"). This object keeps the namespace-wide
# object caps and ephemeral storage (PriorityClass scopes cannot track it); the
# pods cap includes the ops Pods below.
spec:
  hard:
    pods: "272"
    requests.ephemeral-storage: 1080Gi
    limits.ephemeral-storage: 9400Gi
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
# Runner Pods only: the envelope (same values as the former estate-ci-runners).
# COORD P0 2026-11-07 05:27Z raised requests.cpu 146 -> 215 (= node4-8
# allocatable, 5 x 43) when it bound at 144.7/146 with workers 42-67% used.
# estate-ci#69 (2026-11-09): requests.cpu is the per-worker CPU budget again
# (runners.yaml capacity, bound: quota; render_runners.py fails if it is above
# the workers' runner budget): 215 -> 98, the runner budget 98.3 = the sum over
# node4-8 of min(allocatable 47 - reserve 2.35 - non-runner requests, slots x
# 2.8); node8 is held to 4 slots x 2.8 = 11.2. D-486 (Jason 2026-11-09): reserve
# at 95% of allocatable; the 110 in the decision used a stale 112 CPU of
# non-runner requests (117.3 measured 2026-11-09T23:5xZ). Runner requests used,
# 48 h to 2026-11-09T18Z: p95 76.4, p99 110.1, max 124.9 CPU; workers reached
# 1.0-1.09 of allocatable CPU in that window. Above 98 the
# ResourceQuota admission plugin rejects the EphemeralRunner Pod create (403
# "exceeded quota"), the condition the P0 raise removed. ARC 0.14.2
# (ephemeralrunner_controller.go) retries that create every 30 s and, once the
# EphemeralRunner is 10 minutes old, deletes and re-creates it; no Pod exists
# meanwhile and the job stays queued in GitHub (gha_assigned_jobs above
# gha_running_jobs). So the top ~5% of bursts wait instead of scheduling beside
# platform Pods. The bound is aggregate, not per node: the scheduler can still
# put runners on one worker up to its slot cap and free requests, leaving that
# worker no reserve (ADR-0010 point 7).
# D-488 (Jason 2026-11-09, no more cores): requests.cpu stays 98. Runner CPU
# requests dropped to measured active use (runners.yaml header), so the same 98
# holds about 20% more runners (weighted mean Pod request 1.09 -> 0.87 CPU;
# 2026-11-09 peak mix 68 Pods at 104.8 CPU -> 79.4 CPU). The render budget is
# now 102.7 only because the largest Pod (verdify-platform-ci-dashboard, 3.9)
# raises node8's 4-slot ceiling to 15.6; that is not new room, so the quota is
# not raised with it.
# D-528 (estate-ci#179): ci-incident runner Pods (the runners.yaml incident_sets)
# count against this same envelope, so the aggregate runner budget is unchanged
# and they never fall into estate-ci-ops. Limit: when requests.cpu here is
# exhausted the Pod create is refused at admission, which preemption cannot
# help; the observed incident wait (2026-11-10) was on ci-runner-slot.
# D-575 (c) (Jason 2026-11-12T22:04:02Z, estate-ci#193): requests.cpu 98 -> 82,
# the re-rendered budget. Non-runner requests on node4-8 were re-measured
# 2026-11-13T14:32:51Z at 138.0 CPU (117.3 on 11-09; storage-infra#1666 closed
# refuted, so Longhorn's ~5.6 CPU per worker stays), which puts the runner
# budget at 82.7 CPU; at 98 the D-486 reserve was not real even in aggregate.
# Slots and the hot guard are unchanged (D-481, D-502 (b)); bursts above 82
# queue in GitHub as described above. Re-measure non_runner_cpu when platform
# requests move and re-render this value with it.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: estate-ci-runner-pods
spec:
  hard:
    pods: "262"
    requests.cpu: "82"
    requests.memory: 365Gi
    limits.cpu: "4780"
    limits.memory: 2740Gi
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: ["ci-preemptible", "ci-preemptible-infra", "ci-incident"]
---
# Everything else in ci-runners (the ci-runner-hot-guard CronJob): its own small
# budget, so runners can never starve it.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: estate-ci-ops
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: NotIn
        values: ["ci-preemptible", "ci-preemptible-infra", "ci-incident"]
---
apiVersion: v1
kind: LimitRange
metadata:
  name: estate-ci-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 256Mi
      default:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 1Gi
