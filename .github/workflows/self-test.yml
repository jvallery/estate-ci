# estate-ci's own checks, on its own ARC set (R1: no hosted runners anywhere).
name: self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: ./.github/workflows/checks.yml
    with:
      name: lint
      run: bash scripts/self-test.sh
      in-job-image: true
      timeout-minutes: 15
  # estate-ci#111 (STD-IAC-17): kustomize build + kubeconform of deploy/foundation,
  # the Argo-delivered path. Context "foundation / foundation". Runs bare on the
  # toolbox-image set, not in the estate-ci-ci job sidecar (which also has both
  # tools), so a broken deploy/foundation sidecar script cannot block its own fix.
  foundation:
    uses: ./.github/workflows/checks.yml
    with:
      name: foundation
      run: bash scripts/foundation-check.sh
      runner: estate-ci-ci-toolbox
      timeout-minutes: 10
