# estate-ci's own image mirrors (mirrors.txt): runner, Kaniko, toolbox bases and
# the job images runners.yaml pins from the origin. PRs validate the list on
# estate-ci-ci. A push to main that changes it copies the missing digests on
# estate-ci-build with the estate-ci zot writer (zot-push-estate-ci);
# workflow_dispatch on main re-runs the copy (present digests are skipped).
name: mirror-images

on:
  pull_request:
    paths: [mirrors.txt, deploy/foundation/bin/mirror.sh, .github/workflows/mirror*.yml]
  push:
    branches: [main]
    paths: [mirrors.txt, deploy/foundation/bin/mirror.sh, .github/workflows/mirror*.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mirrors:
    uses: ./.github/workflows/mirror.yml
    with:
      apply: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
