# Reusable: build one image in-cluster (Kaniko sidecar) and optionally push it to zot by digest.
#
#   jobs:
#     app:
#       uses: jvallery/estate-ci/.github/workflows/image-build.yml@<sha>
#       with: {image: jvallery/weather-app, dockerfile: Dockerfile.app, push: true}
#
# push: true runs on "<repo>-build" (default-branch push/dispatch only; the
# runner Pod mounts the repo's zot push credential from Kubernetes). push: false
# runs on the credential-free "<repo>-buildcheck" set, for PRs. Outputs digest
# and image-ref (registry.vallery.net/<image>@sha256:...).
#
# Portability (Forgejo/Gitea Actions): all logic is /opt/estate-ci/image-build.sh;
# no GitHub Environments, OIDC, cache or artifact services. Vendored fallback:
# checkout + `run: $ESTATE_CI/image-build.sh --image ... [--push]`.
name: estate-ci image build

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      target:
        type: string
        default: ""
      build-args:
        description: Newline-separated NAME=value build arguments
        type: string
        default: ""
      push:
        type: boolean
        default: false
      runner:
        description: Scale set label. Default "<repo>-build" (push) or "<repo>-buildcheck"
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 90
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
      image-ref:
        value: ${{ jobs.build.outputs.image-ref }}

permissions:
  contents: read

jobs:
  build:
    name: build ${{ inputs.image }}
    runs-on: ${{ inputs.runner != '' && inputs.runner || format('{0}-{1}', github.event.repository.name, inputs.push && 'build' || 'buildcheck') }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.build.outputs.image-ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: build
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
          TARGET: ${{ inputs.target }}
          BUILD_ARGS: ${{ inputs.build-args }}
          PUSH: ${{ inputs.push }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          set -euo pipefail
          args=(--image "$IMAGE" --dockerfile "$DOCKERFILE" --context "$CONTEXT")
          [[ -z "$TARGET" ]] || args+=(--target "$TARGET")
          while IFS= read -r a; do [[ -z "$a" ]] || args+=(--build-arg "$a"); done <<< "$BUILD_ARGS"
          [[ "$PUSH" != true ]] || args+=(--push)
          "$ESTATE_CI/image-build.sh" "${args[@]}"
