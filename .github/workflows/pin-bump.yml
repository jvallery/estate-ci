# Reusable: open a PR pinning new image digests in GitOps manifests, then
# dispatch the repo's checks workflow on it (job-token PRs start no workflows).
#
#   jobs:
#     pin:
#       needs: [app]
#       permissions: {contents: write, pull-requests: write, actions: write}
#       uses: jvallery/estate-ci/.github/workflows/pin-bump.yml@<sha>
#       with:
#         pins: |
#           deploy/k8s/kustomization.yaml registry.vallery.net/jvallery/weather-app ${{ needs.app.outputs.digest }}
#
# Each pins line is "<file> <image> <digest>"; lines with an empty digest
# (image not rebuilt) are skipped. Rewrites kustomize images entries and inline
# <image>@sha256: references. The caller's checks workflow must accept
# workflow_dispatch.
#
# Portability (Forgejo/Gitea Actions): plain git plus /opt/estate-ci/forge-api.sh
# (FORGE=forgejo switches the API). Vendored fallback: checkout + one run step
# calling $ESTATE_CI/pin-bump.sh.
name: estate-ci pin bump

on:
  workflow_call:
    inputs:
      pins:
        type: string
        required: true
      checks-workflow:
        description: Workflow file to dispatch on the pin branch ("" to skip)
        type: string
        default: ci.yml
      base:
        type: string
        default: main
      source-sha:
        description: Commit the images were built from. Default the caller run's github.sha
        type: string
        default: ""
      auto-merge:
        type: boolean
        default: false
      runner:
        description: Scale set label. Default "<repo>-ci"
        type: string
        default: ""
    outputs:
      pr-url:
        value: ${{ jobs.pin.outputs.pr-url }}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pin:
    runs-on: ${{ inputs.runner != '' && inputs.runner || format('{0}-ci', github.event.repository.name) }}
    timeout-minutes: 10
    outputs:
      pr-url: ${{ steps.pin.outputs.pr-url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0
      - id: pin
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PINS: ${{ inputs.pins }}
          BASE: ${{ inputs.base }}
          CHECKS: ${{ inputs.checks-workflow }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          SOURCE_SHA: ${{ inputs.source-sha != '' && inputs.source-sha || github.sha }}
        run: |
          set -euo pipefail
          args=(--base "$BASE" --source-sha "$SOURCE_SHA")
          while IFS= read -r p; do [[ -z "${p// /}" ]] || args+=(--pin "$p"); done <<< "$PINS"
          [[ -z "$CHECKS" ]] || args+=(--checks-workflow "$CHECKS")
          [[ "$AUTO_MERGE" != true ]] || args+=(--auto-merge)
          "$ESTATE_CI/pin-bump.sh" "${args[@]}"
