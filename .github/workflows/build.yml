# estate-ci's own image: estate-ci-toolbox (images/estate-ci-toolbox).
# PRs build it without push on estate-ci-buildcheck. The push to
# registry.vallery.net/jvallery/estate-ci/toolbox runs on estate-ci-build by
# dispatch on main until the estate-ci zot writer (zot-push-estate-ci) is live;
# then add `push: {branches: [main], paths: [images/estate-ci-toolbox/**]}`.
# Bases come from mirrors.txt: run mirror-images first when they change.
name: build

on:
  pull_request:
    paths: [images/estate-ci-toolbox/**, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toolbox:
    uses: ./.github/workflows/image-build.yml
    with:
      image: jvallery/estate-ci/toolbox
      context: images/estate-ci-toolbox
      dockerfile: images/estate-ci-toolbox/Dockerfile
      push: ${{ github.event_name == 'workflow_dispatch' }}
      timeout-minutes: 60
