# Reusable: gitleaks over the caller repository with the estate-ci toolbox
# binary (STD-EXP-13, D-242, estate-ci#126). Every "<repo>-ci" runner container
# is the toolbox image, so nothing is downloaded at job time.
#
#   jobs:
#     secret-scan:
#       uses: jvallery/estate-ci/.github/workflows/secret-scan.yml@<sha>
#
# gitleaks runs in the runner container when it is the toolbox image, else in
# the runner Pod's "job" sidecar (runners.yaml job_image: the toolbox on most
# sets). A set with neither passes `runner:` naming a toolbox set.
#
# Check context: "<caller job id> / gitleaks". Make it a required check on the
# STD-CI-01 repos; elsewhere call it unrequired or from a `schedule:` trigger
# (the reusable works under any event).
#
# mode "dir" (default) scans the checked-out tree. mode "git" scans history
# reachable from the checkout; pass fetch-depth 0 for the full history.
# The caller's .gitleaks.toml (if present) is used with the default rules
# extended; its allowlist must hold exact values only (`^value$`), never a path
# or a file class. Output is redacted: rule, file and line only.
#
# Portability (Forgejo/Gitea Actions): checkout + one `run:` step; vendor it as
# `gitleaks dir . --redact=100 --no-banner [--config .gitleaks.toml]`.
name: estate-ci secret-scan

on:
  workflow_call:
    inputs:
      mode:
        description: dir (checked-out tree) or git (history reachable from the checkout)
        type: string
        default: dir
      fetch-depth:
        type: number
        default: 1
      config:
        description: gitleaks config path in the caller repo, used when it exists
        type: string
        default: .gitleaks.toml
      runner:
        description: Scale set label. Default "<repo>-ci"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runner != '' && inputs.runner || format('{0}-ci', github.event.repository.name) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      - name: gitleaks (estate-ci toolbox)
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          case "$MODE" in dir|git) ;; *) echo "mode must be dir or git" >&2; exit 2;; esac
          if command -v gitleaks >/dev/null; then
            exec_in=(bash -s)
          else
            # Runner container is the stock runner: run in the toolbox job sidecar.
            exec_in=(env ENV_NAMES="MODE CONFIG" TIMEOUT_MINUTES=8 "$ESTATE_CI/sidecar-run.sh" job)
          fi
          "${exec_in[@]}" <<'SCAN'
          set -euo pipefail
          args=(--redact=100 --no-banner --verbose --exit-code 1)
          [[ ! -f "$CONFIG" ]] || args+=(--config "$CONFIG")
          echo "gitleaks $(gitleaks version) mode=$MODE config=$([[ -f "$CONFIG" ]] && echo "$CONFIG" || echo default)"
          gitleaks "$MODE" . "${args[@]}"
          SCAN
