# Reusable: run one check command on the caller repo's estate-ci runner.
#
#   jobs:
#     test:
#       uses: jvallery/estate-ci/.github/workflows/checks.yml@<sha>
#       with: {name: test, run: ci/test.sh}
#
# Check context: "<caller job id> / <name>". Runs on "<repo>-ci" unless runner
# is given. in-job-image runs the command in the repo's CI image sidecar
# (runners.yaml job_image). postgres waits for the "<repo>-pg" Postgres sidecar
# and exports PGHOST/PGPORT/PGUSER/PGDATABASE/DATABASE_URL.
#
# Portability (Forgejo/Gitea Actions): the only logic is `run` (a repo script)
# and /opt/estate-ci/*.sh, which the runner Pod provides on any forge. If the
# forge cannot call a cross-repo reusable workflow, vendor this job: it is
# checkout + one `run:` step. Uses only actions/checkout.
name: estate-ci checks

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: run
      run:
        description: Command(s) to run from the repository root (keep it a repo script)
        type: string
        required: true
      runner:
        description: Scale set label. Default "<repo>-ci"
        type: string
        default: ""
      in-job-image:
        type: boolean
        default: false
      env-names:
        description: Space-separated runner env var names passed into the job image
        type: string
        default: ""
      postgres:
        type: boolean
        default: false
      fetch-depth:
        type: number
        default: 1
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.runner != '' && inputs.runner || format('{0}-ci', github.event.repository.name) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false
      - name: ${{ inputs.name }}
        shell: bash
        env:
          RUN: ${{ inputs.run }}
          IN_JOB_IMAGE: ${{ inputs.in-job-image }}
          POSTGRES: ${{ inputs.postgres }}
          EXTRA_ENV: ${{ inputs.env-names }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          set -euo pipefail
          pg_env=""
          if [[ "$POSTGRES" == true ]]; then
            eval "$("$ESTATE_CI/wait-postgres.sh")"
            pg_env="PGHOST PGPORT PGUSER PGDATABASE DATABASE_URL"
          fi
          if [[ "$IN_JOB_IMAGE" == true ]]; then
            ENV_NAMES="$EXTRA_ENV $pg_env CI GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_EVENT_NAME" \
              "$ESTATE_CI/sidecar-run.sh" job <<< "$RUN"
          else
            bash -euo pipefail -c "$RUN"
          fi
