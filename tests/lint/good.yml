# expect:
# Forgejo notes: portable fixture (checkout + estate-ci workflow + local script only).
name: good
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      x: {type: string, default: ""}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    uses: jvallery/estate-ci/.github/workflows/lint.yml@d23441a48e516b6c34aea4fa41551a30e30af803
  test:
    runs-on: demo-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: bash ci/test.sh
        env:
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
  local:
    uses: ./.github/workflows/other.yml
  matrix:
    strategy:
      matrix:
        shard: [1, 2]
    runs-on: >-
      demo-ci
    steps:
      - run: bash ci/shard.sh "${{ matrix.shard }}"
