# Copy to <repo>/.github/workflows/build.yml. Requires the repo's zot push
# Secret ci-runners/zot-push-<repo> and a "<repo>-build" set (runbook steps 2-3).
name: build

on:
  push:
    branches: [main]
    paths: [Dockerfile, src/**, requirements.lock]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@<sha>
    with:
      image: jvallery/<repo>-app
      dockerfile: Dockerfile
      push: true

  pin:
    needs: [app]
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: jvallery/estate-ci/.github/workflows/pin-bump.yml@<sha>
    secrets:
      # vallery-pin-bot App key; with repo variable PIN_BOT_CLIENT_ID the PR gets normal pull_request CI.
      pin-bot-private-key: ${{ secrets.PIN_BOT_PRIVATE_KEY }}
    with:
      pins: |
        deploy/k8s/kustomization.yaml registry.vallery.net/jvallery/<repo>-app ${{ needs.app.outputs.digest }}
      checks-workflow: ci.yml   # fallback only, when the pin-bot secret is absent

