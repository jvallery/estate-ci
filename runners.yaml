        # D-39 (Jason 2026-11-06 ~21:15Z): 4 -> 12.
        # D-55 (Jason first-hand 2026-11-06 ~22:43Z, ARC-RAISE): 12 -> 16 (queue p90 7.5 min, busy hit 12).
        # D-87 hold absorb (CI-BALANCE, COORD 2026-11-07): node6 hold +4 vCPU -> 16 -> 18.
        max: 18
        job_image: registry.vallery.net/jvallery/vault-ci@sha256:afedf20188449a65eb77b1299ae61b40285d89996c9aef04524cfe567aaab009
        job_uid: 1001
        # COORD 2026-11-06 ~20:0xZ (Jason: accelerate RV2 CI): 'unit' took 30-36 min
        # pinned at ~1 core under limit 2 / 4Gi. Was 500m / 768Mi req, 2 / 4Gi lim.
        # COORD P0 2026-11-07 05:27Z: CPU request = 6 h p75 of active use (was p90/p95); limits unchanged so bursts still get CPU.
        # D-488 (Jason 2026-11-09): CPU request = job active p50 1.01 CPU, 2026-11-06T12Z..11-10T00Z (2100m -> 1050m); limits unchanged.
        job_resources: {cpu: 1050m, memory: 5760Mi, limit_cpu: "8", limit_memory: 8Gi}
        # D-488 (Jason 2026-11-09): CPU request = runner active p75 0.11 CPU, 2026-11-06T12Z..11-10T00Z (100m -> 150m); limits unchanged.
        runner_resources: {cpu: 150m, memory: 256Mi, limit_cpu: "2", limit_memory: 2Gi}
      pg:
        # COORD 2026-11-06 ~18:4xZ (D5 critical path, Jason GO): 1 -> 3.
