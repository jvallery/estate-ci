        # COORD P0 2026-11-07 05:27Z: CPU request = 6 h p75 of active use (was p90/p95); limits unchanged so bursts still get CPU.
        # D-488 (Jason 2026-11-09): CPU request = job active p50 0.74 CPU, 2026-11-06T12Z..11-10T00Z (800m -> 750m); limits unchanged.
        job_resources: {cpu: 750m, memory: 512Mi, limit_cpu: "8", limit_memory: 8Gi}
