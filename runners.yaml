# estate-ci runner registry. The ONLY input to scripts/render_runners.py, which
# writes deploy/runners/apps/*.yaml (one Argo Application per ARC scale set).
# Onboarding a repo = add an entry here, run `python3 scripts/render_runners.py`,
# open a PR. CI fails if the rendered files are stale.
#
# Profiles (scale set name = <repo>-<suffix>; that name is also the runs-on label):
#   ci          runner [+ job sidecar running the repo CI image]         suffix -ci
#   pg          runner + Postgres sidecar on 127.0.0.1:5432 [+ job]       suffix -pg
#   build       runner + Kaniko sidecar + the repo's zot push secret
#               (zot-push-<repo>); default-branch push/dispatch only    suffix -build
#   buildcheck  runner + Kaniko sidecar, no push credential (PR builds)  suffix -buildcheck
#   ci-<v>      another ci set with its own job_image, for repos whose checks
#               need several CI images (e.g. homeassistant)                suffix -ci-<v>
# ci options: runner_image (a runner image built FROM the stock actions-runner,
# so bare run: steps get the repo's tools) and runner_resources override the defaults.
# Sizes are requests -> limits per Pod. The namespace ResourceQuota
# (deploy/foundation/quota.yaml) is the hard envelope across all sets.
defaults:
  # estate-ci-toolbox (ADR-0004, estate-ci#16; images/estate-ci-toolbox), built
  # in-cluster by build.yml on main b1f323c5 (tag gha-b1f323c57983). FROM the
  # stock runner (uid 1001), so it serves as runner_image and as job_image.
  toolbox: &toolbox registry.vallery.net/jvallery/estate-ci/toolbox@sha256:fe6107cb7dab551e5afe90527fc084a4930a7433b6b733f38c6cc8a0330d6d5b
  chart_version: 0.14.2
  controller_service_account: {namespace: arc-systems, name: arc-gha-rs-controller}
  # Stock actions-runner 2.338.2, mirrored by mirrors.txt (same index digest as upstream).
  runner_image: registry.vallery.net/jvallery/estate-ci/mirror/ghcr.io/actions/actions-runner@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
  # gcr.io/kaniko-project/executor:v1.23.2-debug, mirrored by mirrors.txt (same digest native CI uses).
  kaniko_image: registry.vallery.net/jvallery/estate-ci/mirror/gcr.io/kaniko-project/executor@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
  # CloudNativePG PostgreSQL (includes pgvector), mirrored in zot.
  postgres_image: registry.vallery.net/jvallery/mirror-ghcr-io-cloudnative-pg-postgresql-777ad6774e00fff6@sha256:d66df406385b9f3c43c47e94fe3a0002278ef56d21b82a8c9d3a22f91aa9c3f0
  max:
    ci: 3
    pg: 1
    build: 1
    buildcheck: 1

# GitHub App registration Secret per owner (Secret in namespace ci-runners).
owners:
  jvallery: arc-github-app-jvallery

# Scale sets. repo: owner/name registers at repository level (jvallery is a
# user account). org: <owner> registers one org-level set shared by all repos
# of that organization; name is then required.
sets:
  - repo: jvallery/weather
    profiles:
      ci:
        max: 3
        job_image: registry.vallery.net/jvallery/weather-ci@sha256:f4fceab3222d3817baf8def870970981eb88a853cf42f2dc36efcec779f46673
        job_uid: 1001
        job_resources: {cpu: "1", memory: 3Gi, limit_cpu: "4", limit_memory: 8Gi}
      build:
        max: 2
        kaniko_resources: {cpu: "1", memory: 3Gi, limit_cpu: "3", limit_memory: 12Gi}
      buildcheck:
        max: 1
        kaniko_resources: {cpu: "1", memory: 3Gi, limit_cpu: "3", limit_memory: 12Gi}
  # Research Vault v2 (research-vault#200, second pilot; COORD 2026-11-06).
  # Native steps -> profiles: lint-unit and manifests -> research-vault-ci,
  # postgres -> research-vault-pg (2 shards, run one at a time), vault-server and
  # vault-ci images -> research-vault-build. Every job runs in the vault-ci job
  # image (the digest native pins in the agents registry record gh-1442052745).
  # The pg sidecar is the production CNPG image (PostgreSQL 16.15 + pgvector
  # 0.8.7), the same digest as research-vault deploy/k8s/database/cluster.yaml.
  # Sizes: job = native check pod (500m request, 2 CPU / 4Gi limit), Kaniko =
  # native standard build (1 CPU / 2Gi request) with the ADR-0003 12Gi limit. Capacity moved from
  # agent-fleet-ci-foreign-budget, see deploy/foundation/quota.yaml.
  # build mounts ci-runners/zot-push-research-vault (central KSOPS); its jobs stay
  # off in the repo until that Secret exists.
  - repo: jvallery/research-vault
    profiles:
      ci:
        max: 2
        job_image: registry.vallery.net/jvallery/vault-ci@sha256:5a4b84df9e93d04dadab9da714f456f8f1231aaa59954103081e6144d22ed964
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 768Mi, limit_cpu: "2", limit_memory: 4Gi}
      pg:
        max: 1
        job_image: registry.vallery.net/jvallery/vault-ci@sha256:5a4b84df9e93d04dadab9da714f456f8f1231aaa59954103081e6144d22ed964
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 768Mi, limit_cpu: "2", limit_memory: 4Gi}
        postgres_image: registry.vallery.net/jvallery/mirror-ghcr-io-cloudnative-pg-postgresql-b67681006859e657@sha256:09109f553eafc0ed17dccf0c8b3af77a6e1293707a2a14d8d6458a2de3a964eb
        postgres_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "1", limit_memory: 2Gi}
      build:
        max: 1
        kaniko_resources: {cpu: "1", memory: 2Gi, limit_cpu: "2", limit_memory: 12Gi}
  # kepler (jvallery/agents#6092, kepler#34). Job image = the python base the
  # app ships on (app/Dockerfile), for unit/render (pip); static and secret-scan
  # run in the runner container. build is added with the zot principal ci-kepler.
  - repo: jvallery/kepler
    profiles:
      ci:
        max: 2
        job_image: docker.io/library/python@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "2", limit_memory: 3Gi}
      buildcheck:
        max: 1
        kaniko_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "2", limit_memory: 4Gi}
      # Pushes jvallery/kepler-estate-mcp with zot principal ci-kepler
      # (storage-infra si#1395) via the KSOPS Secret ci-runners/zot-push-kepler.
      build:
        max: 1
        kaniko_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "2", limit_memory: 4Gi}
  # MIGRATE-APPS repos (jvallery/agents#6092). Checks run in the estate-ci
  # toolbox; homeassistant adds sets for its two CI images (ci-<variant>).
  # Max runners kept low while workers are CPU-tight; jobs queue instead.
  - repo: jvallery/docs
    profiles:
      ci:
        max: 1
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 1536Mi, limit_cpu: "3", limit_memory: 4Gi}
  - repo: jvallery/options-tracker
    profiles:
      ci:
        max: 1
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 1536Mi, limit_cpu: "3", limit_memory: 4Gi}
  - repo: jvallery/sentinel
    profiles:
      ci:
        max: 2
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "2", limit_memory: 3Gi}
  - repo: jvallery/homeassistant
    profiles:
      ci:
        max: 2
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "2", limit_memory: 3Gi}
      ci-ha:
        max: 1
        job_image: registry.vallery.net/jvallery/homeassistant-ci-homeassistant@sha256:ee28d5eaa7269fbbb3a8049f1bbd9723e784636cd3576be719c2471f9e704b90
        job_uid: 1001
        job_resources: {cpu: "1", memory: 2Gi, limit_cpu: "3", limit_memory: 6Gi}
      ci-esphome:
        max: 1
        job_image: registry.vallery.net/jvallery/homeassistant-ci-esphome@sha256:034609288b8085f540677f856bd70cc877791e4a50f6f87fadff21b854a948cf
        job_uid: 1001
        job_resources: {cpu: "1", memory: 2Gi, limit_cpu: "3", limit_memory: 6Gi}
  # verdify-platform (DASH, verdify-platform#1397/#1402). It transfers to jvallery
  # first (D19), hence the jvallery URL. Sets follow #1402's job map, all uid 1001
  # (ci/gha/lib.sh makes a private writable HOME):
  #   -ci            python:3.13-bookworm (native validate image): trusted-precheck,
  #                  path-impact, validate, lint, build.yml impact
  #   -ci-tools      agents-ci-tools (uv, verdify-campaign-ci with its private PG16):
  #                  platform-static/-tests, campaign-qualification, firmware-logic, campaign
  #   -ci-esphome    ESPHome 2026.6.5, mirrored into zot by mirrors.txt (index digest
  #                  unchanged): firmware-secretless-compile
  #   -ci-dashboard  weather-ci (node, pnpm, Playwright): dashboard
  #   -build         Kaniko; mounts zot-push-verdify-platform (ci-verdify-platform,
  #                  writes verdifyconsultancy/verdify-* only; registry paths unchanged)
  #   -ci-pg         agents-ci-tools + a PostgreSQL 16.15/pgvector sidecar on 127.0.0.1:5432
  #                  (the research-vault pg digest): the 7 private-Postgres campaign test
  #                  files in #1402 (COORD 2026-11-06); checks.yml postgres: true.
  # Quota moves in when native verdify slots are lowered.
  - repo: jvallery/verdify-platform
    profiles:
      ci:
        max: 2
        job_image: mirror.gcr.io/library/python@sha256:353cf2106d143e1d28f5d7c10c5f5c0387085bba22ef0f7f7e52c2c330fb1779
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "2", limit_memory: 4Gi}
      ci-tools:
        max: 2
        job_image: registry.vallery.net/jvallery/agents-ci-tools@sha256:c581b862f3da5c79f71fc982455684350628bc4c9fa51dff77d3b8354cd8f214
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "2", limit_memory: 4Gi}
      ci-pg:
        max: 1
        postgres: true
        job_image: registry.vallery.net/jvallery/agents-ci-tools@sha256:c581b862f3da5c79f71fc982455684350628bc4c9fa51dff77d3b8354cd8f214
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "2", limit_memory: 4Gi}
        postgres_image: registry.vallery.net/jvallery/mirror-ghcr-io-cloudnative-pg-postgresql-b67681006859e657@sha256:09109f553eafc0ed17dccf0c8b3af77a6e1293707a2a14d8d6458a2de3a964eb
      ci-esphome:
        max: 1
        job_image: registry.vallery.net/jvallery/estate-ci/mirror/ghcr.io/esphome/esphome@sha256:ffe23402d169fc9b8ff29fc3c9fc13b3c47e8a53726fce4569e2280bd534c84c
        job_uid: 1001
        job_resources: {cpu: "1", memory: 2Gi, limit_cpu: "4", limit_memory: 8Gi}
      ci-dashboard:
        max: 1
        job_image: registry.vallery.net/jvallery/weather-ci@sha256:f4fceab3222d3817baf8def870970981eb88a853cf42f2dc36efcec779f46673
        job_uid: 1001
        job_resources: {cpu: "1", memory: 3Gi, limit_cpu: "4", limit_memory: 8Gi}
      build:
        max: 1
        kaniko_resources: {cpu: "1", memory: 2Gi, limit_cpu: "2", limit_memory: 12Gi}
  # jvallery/agents on ARC (D19, Jason first-hand). The job image is native CI's own
  # source-check image (native_ci_controller_deployment.IMAGE): Python 3.11-3.13,
  # Node 24, Ruby, kubectl, gitleaks, the prebaked wheelhouse and the PG16 +
  # pgvector rootfs that daemon_free_pg16.py starts in-process, so PostgreSQL
  # checks need no sidecar. agents' .github/workflows/estate-ci.yml runs the
  # native catalog through the same runner scripts (ci/estate-ci/native_parity.py).
  # It shares the namespace quota until the native agents slots move in (COORD).
  - repo: jvallery/agents
    profiles:
      ci:
        # COORD 2026-11-06 13:5xZ (Jason: max speed): 6 -> 12. Each runner requests 1.25 CPU / 2Gi
        # (runner 250m/512Mi + job 1/1536Mi, measured job ~1 core / ~0.6Gi). +6 runners = +7.5 CPU /
        # +12Gi against 17.2 CPU / 18.4Gi free worker requests and 19.5 CPU / 43Gi free ci-runners quota.
        # N-1 was already short (ClusterN1RequestCapacityInsufficient cpu, about 25 CPU); this deepens it
        # until the native agents slots move here at the J-6 switch.
        max: 12
        job_image: registry.vallery.net/jvallery/agents-native-ci-source@sha256:fec953f17c82ad084299dea666778c629729c4126aa7fa018f4a8be4831779c2
        job_uid: 1001
        job_resources: {cpu: "1", memory: 1536Mi, limit_cpu: "4", limit_memory: 8Gi}
        # COORD 2026-11-06: runner CPU limit 2 -> 4 to cut the ~2.4 min full-history checkout.
        # Limits only; requests stay at the runner default (250m / 512Mi), so no scheduling cost.
        runner_resources: {cpu: 250m, memory: 512Mi, limit_cpu: "4", limit_memory: 2Gi}
      # BUILD-AGENTS (D-22): the 12 images native event-ci built on push to main
      # (agents .github/workflows/build.yml, ci/images.tsv). Mounts
      # ci-runners/zot-push-agents (principal ci-agents, exact jvallery/agents-* paths
      # in storage-infra). Native's standard build profile was 2Gi -> 10Gi Kaniko
      # memory; 12Gi limit adds headroom for the research-runtime and argocd images.
      # No buildcheck set: native never built agents images on PRs.
      build:
        max: 2
        kaniko_resources: {cpu: "1", memory: 3Gi, limit_cpu: "3", limit_memory: 12Gi}
  # estate-ci's own self-test (R1: no GitHub-hosted runners, even here), image
  # mirrors (mirrors.txt, crane copy) and the estate-ci-toolbox build. The build
  # set mounts zot-push-estate-ci (writer for jvallery/estate-ci/** only).
  - repo: jvallery/estate-ci
    profiles:
      ci:
        max: 2
        job_image: docker.io/library/python:3.13-slim@sha256:09a17cad02668ae61ece136b4fd36ac3849e14f670ebedb637ea3e15580525bc
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 512Mi, limit_cpu: "2", limit_memory: 2Gi}
      build:
        max: 1
        kaniko_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "3", limit_memory: 6Gi}
      buildcheck:
        max: 1
        kaniko_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "3", limit_memory: 6Gi}
  # MIGRATE-INFRA repos (jvallery/agents#6092). Every ci set runs its checks in a
  # job sidecar running the estate-ci toolbox (*toolbox; it replaced the fleet
  # agents-arc-runner-toolbox the parity runs used). Sizes follow today's validation-standard
  # runner (1 CPU / 1Gi request, 4Gi limit) scaled per repo; max is the
  # concurrency the repo needs, well under today's per-repo 8.
  # build: the 4 repos whose images native CI builds today (19 images);
  # build mounts ci-runners/zot-push-<repo>. No buildcheck sets: native
  # never built images on PRs (pr_validation: false), so neither do these.
  # Label-swap repos (COORD ruling 2026-11-06 03:07Z: do not rewrite steps):
  # proxmox-infrastructure, home-dotfiles and AI_presentation run their
  # existing bare `run:` steps in the runner container, so their ci set uses
  # the estate-ci toolbox (built FROM the stock actions-runner image; adds
  # gitleaks, ruby, pip, kustomize) as runner_image and has no job sidecar.
  # runner_resources equal the former runner+job totals; only the dropped job
  # sidecars' ephemeral storage leaves the quota. jvallery/backups was archived
  # on 2026-11-06 (backups#87), so its set is removed.
  - repo: jvallery/monitoring-stack
    profiles:
      ci:
        max: 2
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 750m, memory: 1536Mi, limit_cpu: "3", limit_memory: 6Gi}
      build:
        max: 1
        kaniko_resources: {cpu: "1", memory: 2Gi, limit_cpu: "3", limit_memory: 8Gi}
  - repo: jvallery/network-infra
    profiles:
      ci:
        max: 2
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "2", limit_memory: 4Gi}
      build:
        max: 1
        kaniko_resources: {cpu: "1", memory: 2Gi, limit_cpu: "3", limit_memory: 8Gi}
  - repo: jvallery/storage-infra
    profiles:
      ci:
        max: 2
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 750m, memory: 1536Mi, limit_cpu: "3", limit_memory: 6Gi}
      build:
        max: 1
        kaniko_resources: {cpu: "1", memory: 2Gi, limit_cpu: "3", limit_memory: 8Gi}
  - repo: jvallery/cortex-ai-compute
    profiles:
      ci:
        max: 2
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 750m, memory: 2Gi, limit_cpu: "3", limit_memory: 6Gi}
      build:
        max: 1
        kaniko_resources: {cpu: "1", memory: 2Gi, limit_cpu: "3", limit_memory: 12Gi}
  - repo: jvallery/proxmox-infrastructure
    profiles:
      ci:
        max: 1
        runner_image: *toolbox
        runner_resources: {cpu: 750m, memory: 1536Mi, limit_cpu: "4", limit_memory: 6Gi}
  - repo: jvallery/home-dotfiles
    profiles:
      ci:
        max: 1
        runner_image: *toolbox
        runner_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "4", limit_memory: 5Gi}
  - repo: jvallery/AI_presentation
    profiles:
      ci:
        max: 1
        runner_image: *toolbox
        runner_resources: {cpu: 500m, memory: 1Gi, limit_cpu: "4", limit_memory: 5Gi}
  - repo: jvallery/immich-config
    profiles:
      ci:
        max: 1
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 250m, memory: 512Mi, limit_cpu: "2", limit_memory: 3Gi}
  - repo: jvallery/orbit
    profiles:
      ci:
        max: 1
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 250m, memory: 512Mi, limit_cpu: "2", limit_memory: 3Gi}
  - repo: jvallery/paige-companion
    profiles:
      ci:
        max: 1
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 250m, memory: 512Mi, limit_cpu: "2", limit_memory: 3Gi}
  - repo: jvallery/wordpress
    profiles:
      ci:
        max: 1
        job_image: *toolbox
        job_uid: 1001
        job_resources: {cpu: 250m, memory: 512Mi, limit_cpu: "2", limit_memory: 3Gi}
  # memoryos image build (J-8, memoryos#39/#40); the repo moved to jvallery on
  # 2026-11-06 (REPO-MOVE, D19). build needs the KSOPS Secret zot-push-memoryos
  # (zot principal ci-memoryos, storage-infra#1387).
  - repo: jvallery/memoryos
    profiles:
      build:
        max: 1
      buildcheck:
        max: 1
