        # COORD P0 2026-11-07 05:27Z: CPU request = 6 h p75 of active use (was p90/p95); limits unchanged so bursts still get CPU.
        # D-488 (Jason 2026-11-09): CPU request = postgres active p50 0.28 CPU, 2026-11-06T12Z..11-10T00Z (350m -> 300m); limits unchanged.
