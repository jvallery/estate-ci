# estate-ci runner registry. The ONLY input to scripts/render_runners.py, which
# writes deploy/runners/apps/*.yaml (one Argo Application per ARC scale set).
# Onboarding a repo = add an entry here, run `python3 scripts/render_runners.py`,
# open a PR. CI fails if the rendered files are stale.
#
# Profiles (scale set name = <repo>-<suffix>; that name is also the runs-on label):
#   ci          runner [+ job sidecar running the repo CI image]         suffix -ci
#   pg          runner + Postgres sidecar on 127.0.0.1:5432 [+ job]       suffix -pg
#   build       runner + Kaniko sidecar + the repo's zot push secret
#               (zot-push-<repo>); default-branch push/dispatch only    suffix -build
#   buildcheck  runner + Kaniko sidecar, no push credential (PR builds)  suffix -buildcheck
#   ops         runner only (toolbox image) + the repo's KSOPS ops Secret at
#               /run/secrets/ops (0440) + per-set TCP egress to the declared
#               management targets; default-branch workflow_dispatch only  suffix -ops
#   ci-<v>      another ci set with its own job_image, for repos whose checks
#               need several CI images (e.g. homeassistant)                suffix -ci-<v>
# ci options: runner_image (a runner image built FROM the stock actions-runner,
# so bare run: steps get the repo's tools) and runner_resources override the defaults.
# Sizes are requests -> limits per Pod. CPU limits are at most 8 (ADR-0010,
# D-87; the renderer refuses more). D-488 (Jason 2026-11-09: no more cores, use
# the idle CPU on the existing ones): runners are the elastic class, so CPU
# requests follow measured active use, not a high percentile: job, kaniko and
# postgres containers (and a runner container that runs the job steps itself)
# request the p50 of their active CPU (rate > 0.05), floor 250m; a runner
# container beside a job sidecar requests its own active p75, floor 100m. Both
# round up to 50m; classes with fewer than 20 active 1-minute samples keep their
# value, and build/pg runner containers keep the renderer's 100m. Limits are
# unchanged, so jobs still burst onto idle CPU, and under contention CFS
# shares follow requests, so runners yield to platform Pods. Sample:
# 2026-11-06T12:20Z..2026-11-10T00:35Z (the whole ci-runners history), ADR-0010.
# Memory requests are unchanged. The namespace ResourceQuota
# (deploy/foundation/quota.yaml) is the hard envelope across all sets.
defaults:
  # estate-ci-toolbox (ADR-0004, estate-ci#16; images/estate-ci-toolbox), built
  # in-cluster by build.yml on main 11c064f3 (tag gha-11c064f31332; helm v3.22.1). FROM the
  # stock runner (uid 1001), so it serves as runner_image and as job_image.
  toolbox: &toolbox registry.vallery.net/jvallery/estate-ci/toolbox@sha256:e130c841bad833b34a19c6dc39ecfbae13a87553591cfe569c70aaf240850554
  chart_version: 0.14.2
  controller_service_account: {namespace: arc-systems, name: arc-gha-rs-controller}
  # Stock actions-runner 2.338.2, mirrored by mirrors.txt (same index digest as upstream).
  runner_image: registry.vallery.net/jvallery/estate-ci/mirror/ghcr.io/actions/actions-runner@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
  # gcr.io/kaniko-project/executor:v1.23.2-debug, mirrored by mirrors.txt (same digest native CI uses).
  kaniko_image: registry.vallery.net/jvallery/estate-ci/mirror/gcr.io/kaniko-project/executor@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
  # CloudNativePG PostgreSQL (includes pgvector), mirrored in zot.
  postgres_image: registry.vallery.net/jvallery/mirror-ghcr-io-cloudnative-pg-postgresql-777ad6774e00fff6@sha256:d66df406385b9f3c43c47e94fe3a0002278ef56d21b82a8c9d3a22f91aa9c3f0
  # D-87 fair share (COORD/Jason P0 2026-11-07): pending Pods schedule by
  # priority, so these repos' runners use ci-preemptible-infra (-900) and
  # schedule ahead of app-repo runners (ci-preemptible, -1000). Neither preempts
  # anything; every production tier preempts both.
  infra_priority_class: ci-preemptible-infra
  # Jason 2026-11-10 (RV2 OCR critical path: "CI is stuck again for cortex/RV2. Help those lanes"):
  # cortex-ai-compute and research-vault join the infra tier.
  infra_repos: [jvallery/agents, jvallery/monitoring-stack, jvallery/storage-infra, jvallery/network-infra, jvallery/proxmox-infrastructure, jvallery/estate-ci, jvallery/sentinel, jvallery/homeassistant, jvallery/cortex-ai-compute, jvallery/research-vault]
  max:
    ci: 3
    pg: 1
    build: 1
    buildcheck: 1
    ops: 1

# Per-worker CPU budget (estate-ci#69, ADR-0010, STD-CI-10, D-87). render_runners.py
# checks it on every render: per worker, runner ceiling = slots x the largest
# rendered Pod CPU request (bounded by the runner quota); headroom = allocatable
# - reserve_cpu - non_runner_cpu (recorded requests of every non-ci-runners Pod).
# reserve_cpu is D-486's basis (Jason 2026-11-09): runners may fill workers to
# 95% of allocatable, so 2.35 of 47 CPU per worker (was 7, the 85% target, which
# capped runners at 79 CPU against a 48 h runner-request p95 of 76.4).
# bound: quota. No slot value STD-CI-10 allows fits: 20 slots x 3.9 CPU (largest
# Pod, verdify-platform-ci-dashboard since D-488; 2.8 monitoring-stack-ci before)
# = 78 CPU against 17-27 CPU of headroom on node4-7,
# so the slot count cannot be the budget. The budget is the runner ResourceQuota
# instead: estate-ci-runner-pods requests.cpu must not exceed the sum over
# workers of min(headroom, ceiling). That bounds total runner requests to what
# the workers hold beside the reserve in aggregate only: a namespace quota is
# not a per-node reserve, so the scheduler can still fill one worker's free
# requests with runners (up to its slots) and leave it no reserve. Per node,
# the hot guard's reserve tier (deploy/foundation/hot-guard-config.json
# `reserve`) caps a node4-7 worker's slots at 10 while its CPU busy/allocatable
# stays above 0.85 for 2 min (ADR-0010 point 7). non_runner_cpu is a
# recorded snapshot (rounded up to 0.5 CPU) with no drift check; re-measure it
# when platform requests move. EstateCIWorkerCPUSaturated is the live signal.
# Measured 2026-11-09T18:20Z (kubectl --context vallery: node allocatable cpu,
# ci-runner-slot, Running Pods outside ci-runners, effective request per Pod).
capacity:
  reserve_cpu: "2.35"
  bound: quota
  quota: estate-ci-runner-pods
  nodes:
    vm-k3s-node4: {allocatable_cpu: "47", slots: 20, non_runner_cpu: "24"}
    vm-k3s-node5: {allocatable_cpu: "47", slots: 20, non_runner_cpu: "18"}
    vm-k3s-node6: {allocatable_cpu: "47", slots: 20, non_runner_cpu: "22.5"}
    vm-k3s-node7: {allocatable_cpu: "47", slots: 20, non_runner_cpu: "27"}
    vm-k3s-node8: {allocatable_cpu: "47", slots: 4, non_runner_cpu: "27.5"}

# GitHub App registration Secret per owner (Secret in namespace ci-runners).
owners:
  jvallery: arc-github-app-jvallery

# Scale sets. repo: owner/name registers at repository level (jvallery is a
# user account). org: <owner> registers one org-level set shared by all repos
# of that organization; name is then required.
sets:
  - repo: jvallery/weather
    profiles:
      ci:
        # D-39 (Jason 2026-11-06 ~21:15Z): 3 -> 9.
        max: 9
        job_image: registry.vallery.net/jvallery/weather-ci@sha256:f4fceab3222d3817baf8def870970981eb88a853cf42f2dc36efcec779f46673
        job_uid: 1001
        # COORD P0 2026-11-07 05:27Z: CPU request = 6 h p75 of active use (was p90/p95); limits unchanged so bursts still get CPU.
        # D-488 (Jason 2026-11-09): CPU request = job active p50 0.99 CPU, 2026-11-06T12Z..11-10T00Z (1600m -> 1000m); limits unchanged.
        job_resources: {cpu: 1000m, memory: 1664Mi, limit_cpu: "8", limit_memory: 8Gi}
        # D-488 (Jason 2026-11-09): CPU request = runner active p75 0.10 CPU, 2026-11-06T12Z..11-10T00Z (100m -> 150m); limits unchanged.
        runner_resources: {cpu: 150m, memory: 256Mi, limit_cpu: "2", limit_memory: 2Gi}
      build:
        # D-39 (Jason 2026-11-06 ~21:15Z): 2 -> 6.
        # ARC-RAISE rebalance (Jason via COORD 2026-11-06 23:36Z, zero-sum): 6 -> 4 (donor: 24 h peak 1 runner).
        max: 4
        # D-488 (Jason 2026-11-09): CPU request = kaniko active p50 0.90 CPU, 2026-11-06T12Z..11-10T00Z (2000m -> 900m); limits unchanged.
        kaniko_resources: {cpu: 900m, memory: 512Mi, limit_cpu: "8", limit_memory: 12Gi}
      buildcheck:
        # D-39 (Jason 2026-11-06 ~21:15Z): 1 -> 2.
        max: 2
        kaniko_resources: {cpu: 250m, memory: 3Gi, limit_cpu: "8", limit_memory: 12Gi}
  # Research Vault v2 (research-vault#200, second pilot; COORD 2026-11-06).
  # Native steps -> profiles: lint-unit and manifests -> research-vault-ci,
  # postgres -> research-vault-pg (2 shards, run one at a time), vault-server and
  # vault-ci images -> research-vault-build. Every job runs in the vault-ci job
  # image: the GHA Kaniko build of Dockerfile.ci at research-vault 29277aac
  # (tag gha-29277aace592, build run 42254218463), which carries Chromium and
  # RV_BROWSER so the lint job runs the web browser specs (research-vault#209).
  # The pg sidecar is the production CNPG image (PostgreSQL 16.15 + pgvector
  # 0.8.7), the same digest as research-vault deploy/k8s/database/cluster.yaml.
  # Sizes: job = native check pod (500m request, 2 CPU / 4Gi limit), Kaniko =
  # native standard build (1 CPU / 2Gi request) with the ADR-0003 12Gi limit. Capacity moved from
  # agent-fleet-ci-foreign-budget, see deploy/foundation/quota.yaml.
  # build mounts ci-runners/zot-push-research-vault (central KSOPS); its jobs stay
